services:
  - type: web
    name: imeta-api
    runtime: node
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: imetadb
          property: connectionString

databases:
  - name: imetadb
    plan: free
