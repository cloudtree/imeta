# Render Blueprint: https://render.com/docs/blueprint-spec
services:
  # 백엔드 API (Express)
  - type: web
    name: imeta-api
    runtime: node
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: imetadb
          property: connectionString
      - key: CORS_ORIGIN
        fromService:
          type: web
          name: imeta-ui
          envVarKey: RENDER_EXTERNAL_URL

  # 프론트엔드 (Vite React SPA)
  - type: web
    name: imeta-ui
    runtime: static
    rootDir: ui
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    # SPA: /login 등 직접 URL·새로고침 시 index.html로 rewrite
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: imeta-api
          envVarKey: RENDER_EXTERNAL_URL

databases:
  - name: imetadb
    plan: free
